{% extends "base.html" %}

{% block title %}{{ term.name }}{% endblock title %}

{% block content %}
<section class="container">
  <a class="text-link back-link" href="/tags/">All tags</a>
  <h1>{{ term.name }}</h1>
</section>
<section class="container">
  <ul class="row-list">
    {% for post in term.pages %}
      {% include "partials/post-row.html" %}
    {% endfor %}
  </ul>
</section>
{% endblock content %}
