{% extends "base.html" %}

{% block title %}Tags{% endblock title %}

{% block content %}
<section class="container">
  <a class="text-link back-link" href="/">Back home</a>
  <h1>Tags</h1>
  <div class="tags">
    {% for term in terms %}
      <a class="tag" href="{{ term.permalink | replace(from=config.base_url, to='') }}">{{ term.name }}</a>
    {% endfor %}
  </div>
</section>
{% endblock content %}
