<!doctype html>
<html lang="{{ lang | default(value=config.default_language) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121116" media="(prefers-color-scheme: dark)">
  <title>{% block title %}{% if page %}{{ page.title }} - {% elif section and section.title %}{{ section.title }} - {% endif %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="canonical" href="{{ current_url | default(value=config.base_url) }}">
  <link rel="icon" href="data:image/svg+xml,{{ load_data(path='images/favicon.svg') | urlencode | safe }}" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="{{ config.title }} RSS feed" href="/rss.xml">
  <link rel="stylesheet" href="/css/site.css">
  {% block extra_head %}{% endblock extra_head %}
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="wordmark" href="/">{{ config.title }}</a>
      <nav class="socials" aria-label="Social links">
        <a href="{{ config.extra.github_url }}" aria-label="GitHub">{{ load_data(path="images/github.svg") | safe }}</a>
        <a href="{{ config.extra.linkedin_url }}" aria-label="LinkedIn">{{ load_data(path="images/linkedin.svg") | safe }}</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock content %}
  </main>

  <footer>
    <ul>
      <li><a href="{{ config.extra.github_url }}">GitHub</a></li>
      <li><a href="{{ config.extra.linkedin_url }}">LinkedIn</a></li>
      <li><a href="/rss.xml">RSS</a></li>
    </ul>
  </footer>
</body>
</html>
